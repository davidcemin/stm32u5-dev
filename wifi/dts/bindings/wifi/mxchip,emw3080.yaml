description: MXCHIP EMW3080 WiFi module (SPI transport, bypass mode)

compatible: "mxchip,emw3080"
# Note: This must match the DT_DRV_COMPAT in emw3080.c (with _ instead of ,)

include: spi-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: Reset GPIO for the EMW3080 module

  power-gpios:
    type: phandle-array
    description: Power GPIO for the EMW3080 module

  wakeup-gpios:
    type: phandle-array
    description: Optional wakeup/data-ready/flow GPIO asserted by module when data available
