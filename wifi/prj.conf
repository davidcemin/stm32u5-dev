# Wi-Fi configuration
CONFIG_WIFI=y
CONFIG_WIFI_INIT_PRIORITY=80
CONFIG_WIFI_OFFLOAD=y  # For Full-MAC Wi-Fi devices
CONFIG_WIFI_USAGE_MODE_STA=y  # Wi-Fi interface as station
# We're including EMW3080 driver directly in our app, don't need CONFIG_EMW3080

# Networking - core configuration
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=4
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=10

# Network interface configuration
CONFIG_NET_IF_MAX_IPV4_COUNT=4
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Network implementation options
CONFIG_NET_NATIVE=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_OFFLOAD=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# Socket configuration
CONFIG_NET_SOCKETS=y
# CONFIG_NET_SOCKETS_POSIX_NAMES=y  # Removed as not defined
CONFIG_NET_SOCKETS_OFFLOAD=y

# Network shell and logging
CONFIG_NET_SHELL=y
CONFIG_NET_LOG=y
# CONFIG_NET_LOG_LEVEL_INF=y  # Removed as not defined

# GPIO for reset pin
CONFIG_GPIO=y

# SPI for EMW3080 communication
CONFIG_SPI=y
CONFIG_SPI_STM32=y
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_SPI_LOG_LEVEL_DBG=y

# UART for AT commands (keeping for compatibility)
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_STM32=y  # Enable STM32 UART driver specifically

# Modem driver support
CONFIG_MODEM=y
CONFIG_MODEM_CONTEXT=y
CONFIG_MODEM_SHELL=y
CONFIG_MODEM_CMD_HANDLER=y
CONFIG_MODEM_IFACE_UART=y
# CONFIG_MODEM_CMD_HANDLER_LOG_LEVEL_INF=y  # Removed as not defined

# Shell support
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y  # Enable device list shell command

# Networking application support
CONFIG_DNS_RESOLVER=y
CONFIG_POSIX_API=y
CONFIG_EVENTFD=y

# Kernel configuration
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Additional logging - cleaner for production use
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_NET_LOG=y

# Optional auto-connect support (disabled by default)
# To enable auto-connect, uncomment and set your WiFi credentials:
# CONFIG_WIFI_AUTOCONNECT_SSID="YourWiFiSSID"
# CONFIG_WIFI_AUTOCONNECT_PSK="YourWiFiPassword"
