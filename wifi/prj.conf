# Wi-Fi configuration
CONFIG_WIFI=y
CONFIG_WIFI_OFFLOAD=y  # For Full-MAC Wi-Fi devices
CONFIG_WIFI_USAGE_MODE_STA=y  # Wi-Fi interface as station
# We're including EMW3080 driver directly in our app, don't need CONFIG_EMW3080

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_MGMT=y

# GPIO for reset pin
CONFIG_GPIO=y

# UART for AT commands
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_STM32=y  # Enable STM32 UART driver specifically

# Modem driver support
CONFIG_MODEM=y
CONFIG_MODEM_CONTEXT=y
CONFIG_MODEM_SHELL=y
CONFIG_MODEM_CMD_HANDLER=y
CONFIG_MODEM_IFACE_UART=y

# Shell support
CONFIG_SHELL=y

# Additional debugging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_NET_LOG=y
# CONFIG_NET_LOG_LEVEL_DBG=y  # Uncomment after fixing Kconfig
CONFIG_DEVICE_SHELL=y  # Enable device list shell command
